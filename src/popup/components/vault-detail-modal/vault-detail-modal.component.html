<div
	class="modal-sheet"
	[class.is-closing]="isClosing()"
	(click)="$event.stopPropagation()">
	<div class="modal-header">
		<div class="header-main">
			<div class="record-icon-large">
				<span>{{ record.title.charAt(0) }}</span>
			</div>
			<div class="header-text">
				<h2 class="record-title">{{ record.title }}</h2>
				<p class="record-website">{{ record.website || 'Internal' }}</p>
			</div>
		</div>
		<button
			(click)="triggerClose()"
			class="close-btn">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				class="w-5 h-5"
				fill="none"
				viewBox="0 0 24 24"
				stroke="currentColor">
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M6 18L18 6M6 6l12 12" />
			</svg>
		</button>
	</div>

	<div class="modal-body overflow-y-auto min-h-0 flex-1">
		<div class="detail-section">
			<div class="field-info">
				<span class="field-label">Username / Email</span>
				<p class="field-value">{{ record.username }}</p>
			</div>
			<button
				(click)="copyUsername(record.username)"
				class="action-pill"
				[class.pill-success]="justCopied() && copiedStatus() === 'username'">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="w-4 h-4"
					fill="none"
					viewBox="0 0 24 24"
					stroke="currentColor">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
				</svg>
				<span>{{
					justCopied() && copiedStatus() === 'username' ? 'Copied' : 'Copy'
				}}</span>
			</button>
		</div>

		<div class="detail-section">
			<div class="field-info">
				<span class="field-label">Secret</span>
				<p class="field-value font-mono">
					{{ reveal() ? record.password : '••••••••••••' }}
				</p>
			</div>
			<div class="action-row">
				<button
					(click)="toggleReveal()"
					class="action-pill pill-square">
					<svg
						*ngIf="!reveal()"
						xmlns="http://www.w3.org/2000/svg"
						class="w-4 h-4"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
					</svg>
					<svg
						*ngIf="reveal()"
						xmlns="http://www.w3.org/2000/svg"
						class="w-4 h-4 text-purple"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
					</svg>
				</button>

				<button
					(click)="copyPassword(record.password)"
					class="action-pill"
					[class.pill-confirm]="copyConfirmActive() && !justCopied()"
					[class.pill-success]="justCopied() && copiedStatus() === 'password'">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						class="w-4 h-4"
						fill="none"
						viewBox="0 0 24 24"
						stroke="currentColor">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
					</svg>
					<span>{{
						justCopied() && copiedStatus() === 'password'
							? 'Copied'
							: copyConfirmActive()
								? 'Copy?'
								: 'Copy'
					}}</span>
				</button>
			</div>
		</div>

		<div
			class="detail-section"
			*ngIf="record.notes">
			<div class="field-info full-width">
				<span class="field-label">Notes</span>
				<p class="field-value notes-text">{{ record.notes }}</p>
			</div>
		</div>
	</div>

	<div class="modal-footer">
		<button
			(click)="triggerEdit()"
			class="footer-btn btn-edit">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				fill="none"
				class="w-4 h-4"
				viewBox="0 0 24 24"
				stroke="currentColor">
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
			</svg>
			Edit
		</button>
		<button
			(click)="onDeleteClick(record.id)"
			class="footer-btn btn-delete"
			[class.btn-delete-active]="deleteConfirmActive()">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				fill="none"
				class="w-4 h-4"
				viewBox="0 0 24 24"
				stroke="currentColor">
				<path
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
					d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
			</svg>
			{{ deleteConfirmActive() ? 'Confirm?' : 'Delete' }}
		</button>
	</div>
</div>
