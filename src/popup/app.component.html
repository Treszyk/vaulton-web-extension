<div
	class="vaulton-app"
	[class.authenticated]="auth.isAuthenticated()">
	<div class="starfield">
		<div class="stars"></div>
		<div class="stars2"></div>
		<div class="stars3"></div>
	</div>

	<div class="content-wrapper">
		<header class="auth-header">
			<div class="logo-container">
				<div class="logo-wrap">
					<h1 class="logo">Vaulton<span class="dot">.</span></h1>
					<span
						class="offline-badge"
						*ngIf="auth.isOffline()"
						>Offline</span
					>
				</div>
				<p class="tagline">Zero-Knowledge Privacy</p>
			</div>
			<button
				*ngIf="auth.isAuthenticated()"
				class="discrete-refresh"
				(click)="onRefresh()"
				[class.spinning]="loading"
				title="Refresh Vault">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke="currentColor">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
				</svg>
			</button>
		</header>

		<main [class.main-full]="auth.isAuthenticated()">
			<app-login
				*ngIf="!auth.isAuthenticated()"
				[loading]="loading"
				(login)="onLogin($event)">
			</app-login>

			<app-main-layout *ngIf="auth.isAuthenticated()"> </app-main-layout>
		</main>
	</div>

	<div
		class="toast-overlay"
		*ngIf="!auth.isAuthenticated()">
		<div
			*ngFor="let n of notifications.notifications()"
			class="toast-item"
			[class]="n.type"
			[class.closing]="n.isClosing"
			(click)="notifications.remove(n.id)">
			<div class="toast-icon">
				<svg
					*ngIf="n.type === 'success'"
					fill="none"
					viewBox="0 0 24 24"
					stroke="currentColor">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M5 13l4 4L19 7" />
				</svg>
				<svg
					*ngIf="n.type === 'error'"
					fill="none"
					viewBox="0 0 24 24"
					stroke="currentColor">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M6 18L18 6M6 6l12 12" />
				</svg>
				<svg
					*ngIf="n.type === 'info' || n.type === 'warning'"
					fill="none"
					viewBox="0 0 24 24"
					stroke="currentColor">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
				</svg>
			</div>
			<div class="toast-content">{{ n.message }}</div>
		</div>
	</div>

	<app-confirm-modal
		*ngIf="showWipeConfirm()"
		title="Wipe Local Data"
		message="CRITICAL: This will destroy ALL local vault keys and session data. Are you absolutely sure?"
		confirmLabel="Wipe Everything"
		[isDanger]="true"
		(confirm)="executeWipe()"
		(cancel)="showWipeConfirm.set(false)">
	</app-confirm-modal>
</div>
